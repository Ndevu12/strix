name: test

# Self-test the Action against this repo, which intentionally carries one inert planted
# indicator (test/fixtures/infected/.gitignore matches `gitignore-autopush-markers`). The two jobs
# exercise both of the Action's config-resolution paths — auto-detected config/security.yml, and an
# explicit config-file — and prove it both suppresses the allowlisted fixture and still FLAGS it
# when the config does not allowlist it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scans-clean:
    name: Passes — auto-detected config/security.yml allowlists the fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix with no config input -> auto-detects config/security.yml -> should PASS
        uses: ./

  report-only-outputs:
    name: Passes — fail-on:never reports the infected verdict without gating
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix report-only against the no-allowlist config -> must PASS, verdict must say infected
        id: scan
        uses: ./
        with:
          config-file: test/detection-check.yml
          fail-on: never
      - name: Assert the outputs still carry the real verdict
        run: |
          # fail-on:never must soften the GATE only — a report-only run that also launders the
          # verdict in its outputs would be worse than useless.
          if [ "${{ steps.scan.outputs.verdict }}" != "infected" ] || [ "${{ steps.scan.outputs.infected }}" != "1" ]; then
            echo "::error::report-only run mis-reported the verdict (verdict='${{ steps.scan.outputs.verdict }}', infected='${{ steps.scan.outputs.infected }}')"
            exit 1
          fi
          echo "Outputs OK: verdict=infected, infected=1, findings=${{ steps.scan.outputs.findings }}."

  rejects-unknown-fail-on:
    name: Fails — an unknown fail-on value is rejected, not fail-open
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix with a typo'd fail-on -> must FAIL fast
        id: scan
        uses: ./
        continue-on-error: true
        with:
          fail-on: warn
      - name: Assert the typo failed the job
        if: always()
        run: |
          # A misspelled tier silently treated as some default would let a workflow think it
          # gates when it doesn't. It must be a hard error.
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::unknown fail-on value did not fail the action (outcome=${{ steps.scan.outcome }})"
            exit 1
          fi

  unit-tests:
    name: Passes — strix unit tests (injection-safe rendering, redaction, config boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run the strix package tests (stdlib unittest, no dependencies)
        # The strix package is the only place attacker-controlled file paths and scan evidence are
        # rendered into Markdown, so its tests are the security regression gate: a path breaking
        # out of its code span, raw evidence leaking, or env access sliding back out of the single
        # Config boundary fails the job. Same invocation style as the scanner project's CI.
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v

  visibility-additive-clean:
    name: Passes — visibility features never turn a CLEAN run red (additive/non-fatal)
    runs-on: ubuntu-latest
    # Deliberately NO security-events/pull-requests grant: SARIF upload + PR comment must degrade to
    # a notice (as on a fork PR), not fail. If any visibility step were fatal, this clean run — which
    # the gate passes — would go red. That regression is exactly what this asserts against.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix on the allowlisted (clean) config with ALL visibility features ON -> must PASS
        id: scan
        uses: ./
        with:
          upload-sarif: true
          upload-artifact: true
          pr-comment: true
      - name: Assert the run stayed green and the SARIF was generated
        run: |
          # A clean scan with every surface enabled must still PASS — the visibility layer is
          # additive and non-fatal. (steps.scan.outcome is 'success' only if nothing failed.)
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "::error::a visibility feature turned a clean run red (outcome=${{ steps.scan.outcome }})"
            exit 1
          fi
          # The scanner supports --sarif, so the action must have generated (and exported) it.
          if [ -z "${{ steps.scan.outputs.sarif }}" ]; then
            echo "::error::sarif output is empty — SARIF was not generated"
            exit 1
          fi
          echo "Clean + all features on stayed green; sarif=${{ steps.scan.outputs.sarif }}"

  visibility-additive-infected:
    name: Fails — visibility features do NOT suppress the gate on an infected run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix on the no-allowlist config with ALL visibility features ON -> the gate must still FAIL
        id: scan
        uses: ./
        continue-on-error: true
        with:
          config-file: test/detection-check.yml
          upload-sarif: true
          upload-artifact: true
          pr-comment: true
      - name: Assert the gate still fired (features are additive, they don't launder the verdict)
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::visibility features suppressed the gate on the planted indicator (outcome=${{ steps.scan.outcome }})"
            exit 1
          fi
          echo "Gate still failed on the planted indicator with all visibility features enabled."

  detects-planted-indicator:
    name: Fails — detection genuinely fires on the planted indicator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix with a no-allowlist config -> the gate must FAIL
        id: scan
        uses: ./
        continue-on-error: true
        with:
          config-file: test/detection-check.yml
      - name: Assert the gate failed BECAUSE detection fired (not a setup/config error)
        if: always()
        run: |
          # 1) the Strix gate must have failed (regression guard against the action swallowing the verdict)
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::the Strix gate did not fail on the planted indicator (outcome=${{ steps.scan.outcome }})"
            exit 1
          fi
          # 2) prove the failure was REAL DETECTION, not an install/CLI/config error masquerading as
          #    one: re-run the scanner (installed by the action above) and require the exact
          #    signature + INFECTED verdict. A setup error here fails to match -> the job goes red.
          out="$(saw scan "$GITHUB_WORKSPACE" -c test/detection-check.yml --no-stream 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -q "INFECTED" && echo "$out" | grep -q "gitignore-autopush-markers"; then
            echo "Detection verified: INFECTED + gitignore-autopush-markers."
          else
            echo "::error::planted indicator was NOT actually detected — a setup/config error masqueraded as detection."
            exit 1
          fi
