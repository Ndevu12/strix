name: test

# Self-test the Action against this repo, which intentionally carries one inert planted
# indicator (test/fixtures/infected/.gitignore matches `gitignore-autopush-markers`).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scans-clean:
    name: Passes when the saw config allowlists the fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix with a config that allowlists the fixture -> should PASS
        uses: ./
        with:
          config-file: test/strix-selftest.yml

  detects-planted-indicator:
    name: Fails when scanning with no allowlisting config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Strix with no config -> expected to FAIL on the fixture
        id: scan
        uses: ./
        continue-on-error: true
      - name: Assert Strix flagged the planted indicator
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Strix did NOT flag the planted indicator (outcome=${{ steps.scan.outcome }})"
            exit 1
          fi
          echo "Strix correctly flagged the planted indicator."
