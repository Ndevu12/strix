name: Worm Guard — block infected merges

# Dogfood: Strix scans its OWN repo. Gate PRs (catch injected indicators) and pushes to main
# (catch evil merges). This repo carries one INERT planted indicator on purpose
# (tests/fixtures/infected/.gitignore); config/security.yml allowlists exactly that one file, so a
# real payload anywhere else still fails the gate.
#
# THREAT MODEL: on a pull_request this checks out the PR head, so `uses: ./` runs the action code
# AND config/security.yml FROM THE PR. A PR can therefore weaken its own gate (neuter action.yml or
# widen the allowlist). This gate is a backstop; the real control is branch protection + CODEOWNERS
# review of action.yml / config/security.yml / .github/** (see /.github/CODEOWNERS). The push-to-main
# run is post-merge (detection), so keep the required check + code-owner review enabled.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # pure exit-code gate: green = clean, red = infected — keyed only on the verdict.

jobs:
  worm-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for evil-merge detection)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan this repo with Strix (config/security.yml is the single source of truth)
        uses: ./
        with:
          # Pin the scanner for a reproducible gate — don't float the thing that decides merges.
          # Bump deliberately after reviewing a newer release; scanner-pin-freshness.yml opens an
          # issue when this drifts behind the latest PyPI release so it can't silently go stale.
          version: '0.1.12'
          config-file: config/security.yml
