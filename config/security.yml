# StayAwakeBot Strix — security config for this repo's own worm-guard self-gate.
#
# Strix is itself a worm scanner, so it dogfoods itself: .github/workflows/worm-guard.yml runs the
# Action against this repo on every PR / push to main and fails on findings. This repo ships ONE
# inert, intentionally-planted indicator so the Action can prove it detects worms:
#   tests/fixtures/infected/.gitignore  ->  matches `gitignore-autopush-markers`
#
# Allowlist EXACTLY that one file. `gitignore-autopush-markers` is a REAL Shai-Hulud indicator, so
# the rule is scoped to the fixture's exact path — NOT `tests/**`, which would let a genuine marker
# dropped anywhere else under tests/ evade the gate. A bare path_glob with no signature is ignored by
# design, so it can never blanket-suppress a fresh drop.
#
# Scan settings (exclude_dirs, max_file_bytes, …) are intentionally omitted: the scanner's packaged
# defaults are the single source of truth. Add a `settings:` block only to override them.
#
# THREAT MODEL: this file is read from the checked-out tree, so a PR can edit it. It is guarded by
# CODEOWNERS (see /.github/CODEOWNERS) so widening the allowlist requires maintainer review. The
# self-gate is a backstop, not a substitute for branch protection.
allowlist:
  - {signature: gitignore-autopush-markers, path_glob: "tests/fixtures/infected/.gitignore"}
